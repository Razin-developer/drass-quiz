<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Questions & Answers PDF | സ്വാതന്ത്ര്യദിന ക്വിസ്</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans Malayalam', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      color: #111;
      padding: 15px;
      line-height: 1.25;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: white;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 1px 10px rgba(0,0,0,0.05);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 1.05rem;
      color: #000;
      font-weight: 700;
    }

    .meta-bar {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
      color: #555;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      justify-content: flex-end;
      background: #f0f0f0;
      padding: 8px 12px;
      border-radius: 4px;
    }

    button {
      background-color: #1b5e20;
      color: white;
      border: none;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2e7d32;
    }

    button.secondary {
      background-color: #4a5568;
    }

    button.secondary:hover {
      background-color: #2d3748;
    }

    #questions-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
    }

    .tiebreaker-header {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #000;
      border-top: 1px dashed #888;
      border-bottom: 1px dashed #888;
      padding: 4px 0;
      margin: 4px 0;
      background: #fafafa;
    }

    .question-card {
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      padding: 6px 8px;
      background: #fff;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .qn-header {
      font-weight: 700;
      font-size: 0.8rem;
      color: #1a365d;
      margin-bottom: 2px;
    }

    .qn-eng {
      font-size: 0.82rem;
      font-weight: 600;
      color: #000;
      margin-bottom: 2px;
    }

    .qn-mal {
      font-size: 0.8rem;
      color: #222;
      margin-bottom: 4px;
    }

    .answer-box {
      background-color: #f4fbf5;
      border-left: 3px solid #2e7d32;
      padding: 3px 6px;
      border-radius: 2px;
    }

    .ans-eng {
      font-weight: 700;
      color: #1b5e20;
      font-size: 0.78rem;
    }

    .ans-mal {
      font-weight: 600;
      color: #2e7d32;
      font-size: 0.78rem;
    }

    .hide-answers .answer-box {
      display: none !important;
    }

    /* Print Specific Styles */
    @media print {
      @page {
        size: A4;
        margin: 8mm 10mm;
      }

      body {
        background: white;
        padding: 0;
        color: #000;
      }

      .container {
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }

      .toolbar {
        display: none !important;
      }

      .question-card {
        border: 1px solid #ccc;
        padding: 5px 7px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Independence Day Quiz Competition | സ്വാതന്ത്ര്യദിന ക്വിസ് മത്സരം</h1>
      <div class="meta-bar">
        <span>Total Questions: <strong id="total-count">25</strong></span>
        <span>Date: <strong id="print-date"></strong></span>
      </div>
    </div>

    <div class="toolbar">
      <button onclick="window.print()">Print / Save as PDF</button>
      <button class="secondary" onclick="toggleAnswers()" id="toggle-ans-btn">Hide Answer Key</button>
      <button class="secondary" onclick="window.location.href='/'">Back to Quiz</button>
    </div>

    <div id="questions-list"></div>
  </div>

  <script>
    document.getElementById('print-date').innerText = new Date().toLocaleDateString('en-US', {
      year: 'numeric', month: 'short', day: 'numeric'
    });

    let showAnswers = true;

    function toggleAnswers() {
      showAnswers = !showAnswers;
      const list = document.getElementById('questions-list');
      const btn = document.getElementById('toggle-ans-btn');
      
      if (showAnswers) {
        list.classList.remove('hide-answers');
        btn.innerText = 'Hide Answer Key';
      } else {
        list.classList.add('hide-answers');
        btn.innerText = 'Show Answer Key';
      }
    }

    async function loadQuestions() {
      let questions = [];
      try {
        const res = await fetch('questions.json');
        if (res.ok) {
          questions = await res.json();
        }
      } catch(e) {}

      if (!questions || questions.length === 0) {
        questions = [
          {
            "question": "Which historic movement was launched by Mahatma Gandhi in 1942 demanding an immediate end to British rule?",
            "malayalam_question": "ബ്രിട്ടീഷ് ഭരണം അവസാനിപ്പിക്കണം എന്ന് ആവശ്യപ്പെട്ട് 1942-ൽ ഗാന്ധിജി ആരംഭിച്ച ചരിത്രപ്രസിദ്ധമായ പ്രസ്ഥാനം ഏതാണ്?",
            "answer": "Quit India Movement (1942)",
            "malayalam_answer": "ക്വിറ്റ് ഇന്ത്യ പ്രസ്ഥാനം (1942)"
          }
        ];
      }

      document.getElementById('total-count').innerText = questions.length;

      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, index) => {
        const id = index + 1;
        const isTieBreaker = index >= 20;

        if (index === 20) {
          html += `
            <div class="tiebreaker-header">
              Tie Breaker Round (Questions 21–25) / ടൈ ബ്രേക്കർ റൗണ്ട്
            </div>
          `;
        }

        const headerLabel = isTieBreaker 
          ? `Tie Breaker Q${index - 19} (Q${id})`
          : `Q${id}`;

        html += `
          <div class="question-card">
            <div class="qn-header">${headerLabel}</div>
            <div class="qn-eng">Q${id}. ${q.question}</div>
            <div class="qn-mal">ചോദ്യം ${id}. ${q.malayalam_question}</div>
            <div class="answer-box">
              <div class="ans-eng">Answer: ${q.answer}</div>
              <div class="ans-mal">ഉത്തരം: ${q.malayalam_answer}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    loadQuestions();
  </script>
</body>
</html>
