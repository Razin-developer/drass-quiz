      // Background Preloading of all 40 audio files (20 English + 20 Malayalam)
      function preloadAllAudio() {
        for (let i = 1; i <= 20; i++) {
          ['eng', 'mal'].forEach((lang) => {
            const url = `audio/q${i}_${lang}.wav`
            fetch(url)
              .then((res) => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`)
                return res.blob()
              })
              .then((blob) => {
                const objectUrl = URL.createObjectURL(blob)
                audioCache.set(url, objectUrl)
              })
              .catch((e) => {
                // Fallback to standard audio preload
                const audio = new Audio()
                audio.preload = 'auto'
                audio.src = url
                audioCache.set(url, url)
              })
          })
        }
      }

      // Start preloading immediately on script initialization
      preloadAllAudio()

      function stopAudio() {
        isReading = false
        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel()
          } catch (e) {}
        }
        if (currentAudio) {
          try {
            currentAudio.pause()
            currentAudio.src = ''
            currentAudio = null
          } catch (e) {}
        }
      }

      function playAudioUrl(url, timeoutMs = 25000, playbackRate = 1.0) {
        return new Promise((resolve, reject) => {
          stopAudio()
          isReading = true

          const targetSrc = audioCache.get(url) || url
          const audio = new Audio()
          currentAudio = audio
          audio.crossOrigin = 'anonymous'
          audio.src = targetSrc
          audio.volume = 1.0
          audio.playbackRate = playbackRate

          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext
            if (AudioCtx) {
              const audioCtx = new AudioCtx()
              const source = audioCtx.createMediaElementSource(audio)
              const gainNode = audioCtx.createGain()
              gainNode.gain.value = 1.5
              source.connect(gainNode)
              gainNode.connect(audioCtx.destination)
            }
          } catch (e) {}

          const timer = setTimeout(() => {
            stopAudio()
            reject(new Error('Audio playback timeout'))
          }, timeoutMs)

          audio.onended = () => {
            clearTimeout(timer)
            currentAudio = null
            isReading = false
            resolve()
          }
          audio.onerror = (e) => {
            clearTimeout(timer)
            currentAudio = null
            isReading = false
            reject(e)
          }
          audio.play().catch((e) => {
            clearTimeout(timer)
            currentAudio = null
            isReading = false
            reject(e)
          })
        })
      }

      function speakEnglishWebSpeech(text) {
        return new Promise((resolve) => {
          stopAudio()
          isReading = true

          if (!('speechSynthesis' in window)) return resolve()

          const utterance = new SpeechSynthesisUtterance(text)
          utterance.lang = 'en-IN'
          utterance.rate = 0.8
          utterance.volume = 1.0

          utterance.onend = () => {
            isReading = false
            resolve()
          }
          utterance.onerror = () => {
            isReading = false
            resolve()
          }

          window.speechSynthesis.speak(utterance)
        })
      }

      function speakMalayalamWebSpeech(text) {
        return new Promise((resolve) => {
          stopAudio()
          isReading = true

          if (!('speechSynthesis' in window)) return resolve()

          const utterance = new SpeechSynthesisUtterance(text)
          utterance.lang = 'ml-IN'
          utterance.rate = 0.9
          utterance.volume = 1.0

          utterance.onend = () => {
            isReading = false
            resolve()
          }
          utterance.onerror = () => {
            isReading = false
            resolve()
          }

          window.speechSynthesis.speak(utterance)
        })
      }

      async function speakQuestion(q) {
        stopAudio()
        isReading = true

        try {
          await playAudioUrl(`audio/q${q.id}_eng.wav`, 25000, 1.0)
        } catch (e) {
          await speakEnglishWebSpeech(`Question number ${q.id}. ${q.qn_eng}`)
        }

        if (!isReading && currentPhase !== 2.5) return

        try {
          await playAudioUrl(`audio/q${q.id}_mal.wav`, 25000, 1.0)
        } catch (e) {
          await speakMalayalamWebSpeech(`ചോദ്യം ${q.id}. ${q.qn_mal}`)
        }
      }

      function renderSlide() {
        let html = `<div class="kbd-hint">⌨️ Nav: Space / Arrows</div>`

        if (currentPhase === 0) {
          stopAudio()
          html += `
            <div class="badge">Quiz Competition</div>
            <h1>${quizData.title_eng}</h1>
            <div class="sub-title">${quizData.title_mal}</div>
            <div class="controls">
                <button onclick="window.nextPhase(event)">Start Quiz</button>
            </div>
        `
        } else if (currentPhase === 1) {
          stopAudio()
          html += `
            <div class="badge">Question ${currentQuestionIndex + 1} of ${quizData.questions.length}</div>
            <h1>Get Ready!</h1>
            <div class="controls">
                <button class="secondary" onclick="window.prevPhase(event)">Previous</button>
                <button onclick="window.nextPhase(event)">Show Question</button>
            </div>
        `
        } else if (currentPhase === 2) {
          stopAudio()
          const q = quizData.questions[currentQuestionIndex]
          html += `
            <div class="badge">${q.category_eng}</div>
            <div class="qn-eng"><strong>Q${q.id}.</strong> ${q.qn_eng}</div>
            <div class="qn-mal"><strong>ചോദ്യം ${q.id}.</strong> ${q.qn_mal}</div>
            <div class="controls">
                <button class="secondary" onclick="window.prevPhase(event)">Previous</button>
                <button onclick="window.nextPhase(event)">Read Question 🔊</button>
            </div>
        `
        } else if (currentPhase === 2.5) {
          const q = quizData.questions[currentQuestionIndex]
          html += `
            <div class="speaking-badge">🔊 Reading Question...</div>
            <div class="qn-eng"><strong>Q${q.id}.</strong> ${q.qn_eng}</div>
            <div class="qn-mal"><strong>ചോദ്യം ${q.id}.</strong> ${q.qn_mal}</div>
            <div class="controls">
                <button class="secondary" onclick="window.reSpeak(event)">Re-play 🔊</button>
                <button onclick="window.nextPhase(event)">Pen Down</button>
            </div>
        `
          speakQuestion(q)
        } else if (currentPhase === 3) {
          stopAudio()
          html += `
            <div class="pen-down">✏️ PEN DOWN!</div>
            <div class="controls">
                <button class="secondary" onclick="window.prevPhase(event)">Previous</button>
                <button onclick="window.nextPhase(event)">Show Answer</button>
            </div>
        `
        } else if (currentPhase === 4) {
          stopAudio()
          const q = quizData.questions[currentQuestionIndex]
          const isLastQuestion = currentQuestionIndex + 1 === quizData.questions.length
          const nextBtnText = isLastQuestion ? 'Finish Quiz' : 'Next Question'
          html += `
            <div class="badge">Answer Key</div>
            <div class="answer-box">
                <div class="ans-eng">${q.ans_eng}</div>
                <div class="ans-mal">${q.ans_mal}</div>
            </div>
            <div class="controls">
                <button class="secondary" onclick="window.prevPhase(event)">Previous</button>
                <button onclick="window.nextPhase(event)">${nextBtnText}</button>
            </div>
        `
        } else if (currentPhase === 5) {
          stopAudio()
          html += `
            <div class="badge">Quiz Finished</div>
            <h1>Congratulations! 🎉</h1>
            <div class="sub-title">ക്വിസ് വിജയകരമായി പൂർത്തിയായി!</div>
            <div class="controls">
                <button class="secondary" onclick="window.prevPhase(event)">Previous</button>
                <button onclick="window.restartQuiz(event)">Restart Quiz 🔄</button>
            </div>
        `
        }

        slideContainer.innerHTML = html
      }

      window.nextPhase = function (e) {
        if (e && e.target && e.target.blur) e.target.blur()
        if (currentPhase === 0) currentPhase = 1
        else if (currentPhase === 1) currentPhase = 2
        else if (currentPhase === 2) currentPhase = 2.5
        else if (currentPhase === 2.5) currentPhase = 3
        else if (currentPhase === 3) currentPhase = 4
        else if (currentPhase === 4) {
          if (currentQuestionIndex + 1 < quizData.questions.length) {
            currentQuestionIndex++
            currentPhase = 1
          } else {
            currentPhase = 5
          }
        }
        renderSlide()
      }

      window.prevPhase = function (e) {
        if (e && e.target && e.target.blur) e.target.blur()
        if (currentPhase === 5) currentPhase = 4
        else if (currentPhase === 4) currentPhase = 3
        else if (currentPhase === 3) currentPhase = 2.5
        else if (currentPhase === 2.5) currentPhase = 2
        else if (currentPhase === 2) currentPhase = 1
        else if (currentPhase === 1) {
          if (currentQuestionIndex > 0) {
            currentQuestionIndex--
            currentPhase = 4
          } else {
            currentPhase = 0
          }
        }
        renderSlide()
      }

      window.reSpeak = function (e) {
        if (e && e.target && e.target.blur) e.target.blur()
        speakQuestion(quizData.questions[currentQuestionIndex])
      }

      window.restartQuiz = function (e) {
        if (e && e.target && e.target.blur) e.target.blur()
        stopAudio()
        currentQuestionIndex = 0
        currentPhase = 0
        renderSlide()
      }

      document.addEventListener('keydown', function (event) {
        if (event.code === 'Space' || event.code === 'ArrowRight') {
          event.preventDefault()
          window.nextPhase()
        } else if (event.code === 'ArrowLeft') {
          event.preventDefault()
          window.prevPhase()
        }
      })

      renderSlide()
    </script>
  </body>
</html>
